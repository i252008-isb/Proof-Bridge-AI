[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofbridge-ai"
version = "0.2.0"
description = "AI/ML module for ProofBridge AI: evidence intelligence and project fulfillment verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ocr = ["pytesseract>=0.3.10"]

[tool.setuptools.packages.find]
include = ["proofbridge_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
